name: Deploy

on:
  push:
    branches:
      - 'prod-*'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: pbuilder
  DEPLOY_PATH: /home/pbuilder/crm_luvhere

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_URL: https://crm.luvhere.com/backend
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete removes stale build files. "P" (protect) rules stop rsync
      # from deleting these on the server. No trailing slash on purpose:
      # "backend/" only matches a real directory, so a backend symlink
      # was not protected and got deleted. "/backend" matches it as a
      # directory, symlink or file, at the top of public_html only.
      - name: Upload build over rsync
        run: |
          rsync -az --delete \
            --filter='P /backend' \
            --filter='P /backend/**' \
            --filter='P /.htaccess' \
            --filter='P /.well-known' \
            --filter='P /.well-known/**' \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
